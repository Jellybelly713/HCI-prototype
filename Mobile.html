<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Motion Tool for Blender - Mobile</title>
  <style>
    :root{
      --bg:#0f1115;
      --text:#e7e9ee;
      --muted:#a9b0c1;
      --line:#2a3142;
      --accent:#7aa2ff;
      --radius:16px;
      --shadow:0 12px 30px rgba(0,0,0,.35);
      --font:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    * { box-sizing:border-box; }

    html, body {
      margin:0;
      min-height:100%;
      font-family:var(--font);
      color:var(--text);
      background:linear-gradient(180deg, #0b0d12, var(--bg));
    }

    button, input {
      font:inherit;
    }

    .app {
      max-width:420px;
      margin:0 auto;
      padding:16px 12px 24px;
    }

    .topbar {
      margin-bottom:12px;
    }

    .title h1 {
      margin:0;
      font-size:18px;
      font-weight:800;
    }

    .phone-shell {
      width:100%;
      background:#060814;
      border:1px solid var(--line);
      border-radius:22px;
      overflow:hidden;
      min-height:82vh;
    }

    .phone-top {
      height:38px;
      padding:0 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.06);
      color:var(--muted);
      font-size:11px;
    }

    .phone-content {
      padding:10px;
      min-height:calc(82vh - 38px);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .tabs {
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .tab-btn {
      border:1px solid rgba(122,162,255,.20);
      background:rgba(122,162,255,.08);
      color:var(--muted);
      padding:5px 9px;
      border-radius:5px;
      font-size:11px;
      cursor:pointer;
    }

    .tab-btn.active {
      color:var(--text);
      border-color:rgba(122,162,255,.45);
      background:rgba(122,162,255,.16);
    }

    .phone-panel {
      border:1px solid rgba(255,255,255,.12);
      border-radius:6px;
      padding:8px;
      background:rgba(255,255,255,.02);
    }

    .phone-panel-title {
      font-size:11px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .screen {
      display:none;
    }

    .screen.active {
      display:block;
    }

    .instruction-box {
      min-height:72px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:4px;
      padding:8px;
      color:var(--muted);
      font-size:11px;
      line-height:1.35;
      margin-bottom:10px;
      background:rgba(255,255,255,.015);
    }

    .step-label {
      font-size:11px;
      color:var(--muted);
      margin:10px 0 6px;
    }

    .btn-row {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn {
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--text);
      padding:8px 12px;
      border-radius:6px;
      font-size:12px;
      cursor:pointer;
    }

    .btn:disabled {
      opacity:.45;
      cursor:not-allowed;
    }

    .btn.primary {
      border-color:rgba(122,162,255,.45);
      background:rgba(122,162,255,.14);
    }

    .preview-box {
      min-height:240px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:6px;
      background:#161922;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(255,255,255,.42);
      font-size:12px;
      margin-bottom:10px;
      overflow:hidden;
    }

    .preview-box img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .slider-group {
      margin-bottom:12px;
    }

    .slider-group label {
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:11px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .slider-group input[type="range"] {
      width:100%;
    }

    .record-wrap {
      margin-top:auto;
      display:flex;
      justify-content:center;
      padding-top:4px;
    }

    .record-btn {
      width:54px;
      height:54px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      background:#8b0c0c;
      box-shadow:
        inset 0 0 0 8px #b11212,
        0 10px 24px rgba(0,0,0,.35);
    }

    .record-btn.recording {
      animation:pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform:scale(1); box-shadow:inset 0 0 0 8px #d11f1f, 0 0 0 0 rgba(209,31,31,.35); }
      70% { transform:scale(1.03); box-shadow:inset 0 0 0 8px #d11f1f, 0 0 0 14px rgba(209,31,31,0); }
      100% { transform:scale(1); box-shadow:inset 0 0 0 8px #d11f1f, 0 0 0 0 rgba(209,31,31,0); }
    }

    .mini-form {
      display:grid;
      gap:10px;
    }

  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">
        <h1>Camera Motion Tool</h1>
      </div>
    </div>

      <div class="card-body">
        <div class="phone-shell">
          <div class="phone-top">
            <span>Camera Tool</span>
            <span id="phoneTopRight">12:34</span>
          </div>

          <div class="phone-content">
            <div class="tabs">
              <button class="tab-btn active" data-screen="activation">Activation</button>
              <button class="tab-btn" data-screen="arView">View</button>
              <button class="tab-btn" data-screen="playback">Playback</button>
              <button class="tab-btn" data-screen="settings">Settings</button>
            </div>

            <div class="screen active" id="screen-activation">
              <div class="phone-panel">
                <div class="phone-panel-title">Connection</div>

                <div class="instruction-box">
                  Connect your phone to Blender, choose WiFi or USB, then enter the live camera view.
                </div>

                <div class="step-label">Step 1</div>
                <div class="btn-row">
                  <button class="btn" id="wifiBtn" type="button">WiFi</button>
                  <button class="btn" id="usbBtn" type="button">USB</button>
                </div>

                <div class="step-label">Step 2</div>
                <div class="btn-row">
                  <button class="btn primary" id="connectBtn" type="button">Connect</button>
                  <button class="btn" id="enterViewBtn" type="button">Enter View</button>
                </div>
              </div>

              <div class="record-wrap">
                <button class="record-btn" id="recordBtnActivation" type="button"></button>
              </div>
            </div>

            <div class="screen" id="screen-arView">
              <div class="phone-panel">
                <div class="phone-panel-title">Live View</div>

                <div class="preview-box">
                  <img id="phoneViewportImage" alt="Phone live viewport" />
                  <span id="phoneViewportEmpty">No live viewport yet</span>
                </div>

                <div class="btn-row">
                  <button class="btn" id="cameraDropdownBtn" type="button">Change Active Camera</button>
                  <button class="btn" id="openSettingsBtn" type="button">Camera Settings</button>
                </div>

                <div id="cameraListWrap" style="display:none; margin-top:10px;">
                  <div class="phone-panel-title">Cameras</div>
                  <div class="mini-form" id="cameraList"></div>
                </div>
              </div>

              <div class="record-wrap">
                <button class="record-btn" id="recordBtnView" type="button"></button>
              </div>
            </div>

            <div class="screen" id="screen-playback">
              <div class="phone-panel">
                <div class="phone-panel-title">Playback</div>

                <div class="preview-box">
                  <span id="playbackText">No recording preview yet</span>
                </div>

                <div class="btn-row">
                  <button class="btn" id="previewRecordingBtn" type="button">Preview Motion</button>
                  <button class="btn primary" id="applyMotionBtn" type="button">Apply to Blender</button>
                </div>
              </div>

              <div class="record-wrap">
                <button class="record-btn" id="recordBtnPlayback" type="button"></button>
              </div>
            </div>

            <div class="screen" id="screen-settings">
              <div class="phone-panel">
                <div class="phone-panel-title">Camera Settings</div>

                <div class="slider-group">
                  <label for="speedRange"><span>Speed</span><span id="speedValue">100</span></label>
                  <input id="speedRange" type="range" min="50" max="200" value="100" />
                </div>

                <div class="slider-group">
                  <label for="smoothingRange"><span>Smoothing</span><span id="smoothingValue">35</span></label>
                  <input id="smoothingRange" type="range" min="0" max="100" value="35" />
                </div>

                <div class="slider-group">
                  <label for="distanceRange"><span>Distance Scale</span><span id="distanceValue">100</span></label>
                  <input id="distanceRange" type="range" min="50" max="200" value="100" />
                </div>

                <div class="btn-row">
                  <button class="btn primary" id="saveSettingsBtn" type="button">Save</button>
                  <button class="btn" id="cancelSettingsBtn" type="button">Cancel</button>
                </div>
              </div>

              <div class="record-wrap">
                <button class="record-btn" id="recordBtnSettings" type="button"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
  </div>

  <script>
    const state = {
      selectedMethod: null,
      selectedCamera: "Camera_01",
      recording: false,
      settings: {
        speed: 100,
        smoothing: 35,
        distance: 100
      },
      cameras: ["Camera_01", "Camera_02", "Camera_03"],
      viewportImage: ""
    };

    const tabButtons = document.querySelectorAll(".tab-btn");
    const screens = {
      activation: document.getElementById("screen-activation"),
      arView: document.getElementById("screen-arView"),
      playback: document.getElementById("screen-playback"),
      settings: document.getElementById("screen-settings")
    };

    const wifiBtn = document.getElementById("wifiBtn");
    const usbBtn = document.getElementById("usbBtn");
    const connectBtn = document.getElementById("connectBtn");
    const enterViewBtn = document.getElementById("enterViewBtn");

    const phoneViewportImage = document.getElementById("phoneViewportImage");
    const phoneViewportEmpty = document.getElementById("phoneViewportEmpty");

    const cameraDropdownBtn = document.getElementById("cameraDropdownBtn");
    const openSettingsBtn = document.getElementById("openSettingsBtn");
    const cameraListWrap = document.getElementById("cameraListWrap");
    const cameraList = document.getElementById("cameraList");

    const playbackText = document.getElementById("playbackText");

    const speedRange = document.getElementById("speedRange");
    const smoothingRange = document.getElementById("smoothingRange");
    const distanceRange = document.getElementById("distanceRange");
    const speedValue = document.getElementById("speedValue");
    const smoothingValue = document.getElementById("smoothingValue");
    const distanceValue = document.getElementById("distanceValue");

    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    const cancelSettingsBtn = document.getElementById("cancelSettingsBtn");

    const recordButtons = [
      document.getElementById("recordBtnActivation"),
      document.getElementById("recordBtnView"),
      document.getElementById("recordBtnPlayback"),
      document.getElementById("recordBtnSettings")
    ];

    function updateUI() {
      wifiBtn.classList.toggle("primary", state.selectedMethod === "wifi");
      usbBtn.classList.toggle("primary", state.selectedMethod === "usb");

      if (state.viewportImage) {
        phoneViewportImage.src = state.viewportImage;
        phoneViewportImage.style.display = "block";
        phoneViewportEmpty.style.display = "none";
      } else {
        phoneViewportImage.removeAttribute("src");
        phoneViewportImage.style.display = "none";
        phoneViewportEmpty.style.display = "block";
      }

      speedValue.textContent = state.settings.speed;
      smoothingValue.textContent = state.settings.smoothing;
      distanceValue.textContent = state.settings.distance;

      speedRange.value = state.settings.speed;
      smoothingRange.value = state.settings.smoothing;
      distanceRange.value = state.settings.distance;

      recordButtons.forEach(btn => btn.classList.toggle("recording", state.recording));

      playbackText.textContent = state.recording
        ? "Recording in progress..."
        : "Motion preview will appear here after a capture.";
    }

    function setScreen(name) {
      tabButtons.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.screen === name);
      });

      Object.entries(screens).forEach(([key, el]) => {
        el.classList.toggle("active", key === name);
      });
    }

    function buildCameraList() {
      cameraList.innerHTML = "";
      state.cameras.forEach(cameraName => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn";
        button.textContent = cameraName;
        if (cameraName === state.selectedCamera) {
          button.classList.add("primary");
        }
        button.addEventListener("click", () => {
          state.selectedCamera = cameraName;
          buildCameraList();
        });
        cameraList.appendChild(button);
      });
    }

    wifiBtn.addEventListener("click", () => {
      state.selectedMethod = "wifi";
      updateUI();
    });

    usbBtn.addEventListener("click", () => {
      state.selectedMethod = "usb";
      updateUI();
    });

    connectBtn.addEventListener("click", () => {
      if (!state.selectedMethod) {
        alert("Choose WiFi or USB first.");
        return;
      }
      enterViewBtn.disabled = false;
    });

    enterViewBtn.addEventListener("click", () => {
      setScreen("arView");
    });

    tabButtons.forEach(btn => {
      btn.addEventListener("click", () => setScreen(btn.dataset.screen));
    });

    cameraDropdownBtn.addEventListener("click", () => {
      const isOpen = cameraListWrap.style.display === "block";
      cameraListWrap.style.display = isOpen ? "none" : "block";
    });

    openSettingsBtn.addEventListener("click", () => {
      setScreen("settings");
    });

    function toggleRecord() {
      state.recording = !state.recording;
      updateUI();
    }

    recordButtons.forEach(btn => btn.addEventListener("click", toggleRecord));

    function syncSettingLabels() {
      speedValue.textContent = speedRange.value;
      smoothingValue.textContent = smoothingRange.value;
      distanceValue.textContent = distanceRange.value;
    }

    [speedRange, smoothingRange, distanceRange].forEach(input => {
      input.addEventListener("input", syncSettingLabels);
    });

    saveSettingsBtn.addEventListener("click", () => {
      state.settings.speed = Number(speedRange.value);
      state.settings.smoothing = Number(smoothingRange.value);
      state.settings.distance = Number(distanceRange.value);
      updateUI();
    });

    cancelSettingsBtn.addEventListener("click", () => {
      updateUI();
    });

    buildCameraList();
    updateUI();
    setScreen("activation");

    setInterval(() => {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("phoneTopRight").textContent = `${hh}:${mm}`;
    }, 1000);
  </script>
</body>
</html>
